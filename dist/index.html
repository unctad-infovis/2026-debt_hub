    <!--
      Combined demo page: stacks all 5 embeddable entries (Hero, Stats strip, Featured
      charts, Solutions, DMFAS highlight) with stand-in blocks where Drupal's own View
      blocks are expected to sit on the real unctad.org page — so reviewers can see the
      assembled page without a Drupal instance. It is a demo only: the real unctad.org page
      embeds the 5 entries below as separate Drupal blocks, never this file.

      Served directly (with live JSX) by `vite`/`vite --open` for local preview. For the
      production build, this file is NOT a Vite entry (see vite.config.js) — instead
      scripts/postbuild.js reads this file as a template, swaps the /src/jsx/Index*.jsx dev
      script tags below for the real built entries' <script>/<link> tags, and writes the
      result to dist/index.html; that's what gh-pages serves as its "Live demo" root.

      Placeholder order/placement below is a best guess pending the approved mock-up — treat
      it as a starting point for the Drupal page build, not a final layout decision.
    -->
