<!DOCTYPE html>

        border-top: 1px dashed #999;

  <body>
    <!--
      Full-page preview: combines all 5 embeddable entries (Hero, Stats strip, Featured
      charts, Solutions, DMFAS highlight) with stand-in blocks where Drupal's own View
      blocks are expected to sit on the real unctad.org page. Each entry is also embeddable

      dmfas-highlight.html and the README's "Embedding" section.

      Placeholder order/placement below is a best guess pending the approved mock-up — treat
      it as a starting point for the Drupal page build, not a final layout decision.
    -->

    <div class="app-root-2026-debt_hub" id="app-root-2026-debt_hub-hero">Loading...</div>
    <script type="module" src="/src/jsx/Index.jsx"></script>

    <div class="app-root-2026-debt_hub" id="app-root-2026-debt_hub-stats-strip">Loading...</div>
    <script type="module" src="/src/jsx/IndexStatsStrip.jsx"></script>

    <div class="app-root-2026-debt_hub" id="app-root-2026-debt_hub-solutions">Loading...</div>
    <script type="module" src="/src/jsx/IndexSolutions.jsx"></script>

    <div class="app-root-2026-debt_hub" id="app-root-2026-debt_hub-dmfas-highlight">Loading...</div>
    <script type="module" src="/src/jsx/IndexDmfasHighlight.jsx"></script>

    <div class="drupal_placeholder news_container">Drupal: "Latest debt & finance news" block</div>
    <div class="drupal_placeholder">Drupal: Related meetings/events block</div>
    <div class="drupal_placeholder">Drupal: Newsletter signup (out of scope)</div>
